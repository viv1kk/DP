        }

  TIBCO_EMS:
    index:
      endpoint: http://eurdc01eapl025.nws.nexperia.com:9200/emscheck-*/_search
      method: POST
      payload: | 
        {
          "size": 0,
          "query": {
            "bool": {
              "filter": [
                {
                  "terms": {
                    "emscheck.areaname.keyword": [
                      "A2A_EMEA",
                      "B2B_EMEA"
                    ]
                  }
                }
              ],
              "must_not": [
                {
                  "wildcard": {
                    "emscheck.queuename.keyword": "*_BC7_*"
                  }
                },
                {
                  "prefix": {
                    "emscheck.queuename.keyword": "$TMP$"
                  }
                }
              ]
            }
          },
          "aggs": {
            "by_queue": {
              "composite": {
                "size": 10000,
                "sources": [
                  {
                    "queue": {
                      "terms": {
                        "field": "emscheck.queuename.keyword"
                      }
                    }
                  }
                ]
              },
              "aggs": {
                "latest_record": {
                  "top_hits": {
                    "size": 1,
                    "sort": [
                      {
                        "emscheck.normalmessageagetimestamp": "desc"
                      }
                    ]
                  }
                }
              }
            }
          }
        }
      header: |
       {"Content-Type": "application/json"}
      
      size: 10000
    
    timeout: 30

    api_credentials:
      username: ${ELASTIC_USERNAME}
      password: ${ELASTIC_PASSWORD}

    destination:
      sql_table_name: TIBCO_EMS
      sql_pk: ["_id"]
      sql_pk_constraint_name: PK_TIBCO_EMS
      sql_columnar_index_name: ncci_TIBCO_EMS
      sql_columns: |
        {
          "interfaceid": "VARCHAR(15)",
          "enginename": "VARCHAR(50)",
          "areaname": "VARCHAR(20)",
          "businessobject": "VARCHAR(20)",
          "businessobjectid": "VARCHAR(20)",
          "checktype": "VARCHAR(30)",
          "envlevel": "VARCHAR(25)", 
          "envType": "VARCHAR(10)",
          "queuename": "VARCHAR(255)", 
          "queuemessagecount": "INT",
          "timestamp": "DATETIME2",
          "maxallowedagetimestamp": "DATETIME2",
          "oldestmessagetimestamp": "DATETIME2",
          "normalmessageagetimestamp": "DATETIME2",
          "queuestate": "VARCHAR(15)", 
          "pendingmessagesizekb": "INT",
          "messagedeliverycount": "INT",
          "attributes": "NVARCHAR(MAX)", 
          "_id": "VARCHAR(40)" 
        }
