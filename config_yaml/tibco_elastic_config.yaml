pipelines:
  TIBCO_AUDIT_OPERATIONAL_ERRORS:
    index:
      endpoint: http://eurdc01eapl025.nws.nexperia.com:9200/events/_search
      method: POST
      payload: | 
        {
          "query": {
              "bool": {
                  "must": [
                      {
                          "terms": {
                              "elasticEvent.logtype.keyword": ["AUDIT_ERROR", "ADB_N", "ADB_OPQ", "ADB_F"]
                          }
                      }
                  ]
              }
          },
          "sort": [
              {
                  "elasticEvent.timestamp": {
                      "order": "asc",
                      "format": "strict_date_optional_time"
                  }
              }
          ],
          "size": 25000
        }
      header: |
       {"Content-Type": "application/json"}
      
      size: 25000
    
    timeout: 30

    api_credentials:
      username: ${ELASTIC_USERNAME}
      password: ${ELASTIC_PASSWORD}

    destination:
      sql_table_name: TIBCO_EVENTS_OPERATIONAL_ERRORS
      sql_pk: ["_id"]
      sql_pk_constraint_name: PK_TIBCO_ES_OPERATIONAL_ERRORS
      sql_columnar_index_name: ncci_TIBCO_EVENTS_OPERATIONAL_ERRORS
      sql_columns: |
        {
          "primary_hash": "VARCHAR(255)",
          "_id": "NVARCHAR(255)",
          "interfaceid": "NVARCHAR(255)",
          "enginename": "NVARCHAR(255)",
          "componenttype": "NVARCHAR(32)",
          "machinename": "NVARCHAR(128)",
          "businessobject": "NVARCHAR(255)",
          "businessobjectid": "NVARCHAR(64)",
          "subbusinessobject": "NVARCHAR(64)",
          "correlationid": "NVARCHAR(255)",
          "logtype": "NVARCHAR(64)",
          "timestamp": "NVARCHAR(64)",
          "logdetails_logpath": "NVARCHAR(1024)",
          "logdetails_messagecode": "NVARCHAR(4000)",
          "logdetails_msg": "NVARCHAR(MAX)",
          "logdetails_recoverableflag": "NVARCHAR(255)",
          "servername": "NVARCHAR(64)",
          "Operation_User": "NVARCHAR(255)",
          "Operation_Action": "VARCHAR(64)",
          "Operation_Timestamp": "VARCHAR(35)",
          "Operation_SNC_Ticket": "VARCHAR(20)",
          "Operation_Comments": "NVARCHAR(500)",
          "Operation_JobNumber": "NVARCHAR(150)",
          "formatted_timestamp": "DATETIME",
          "minutes_since_created": "INTEGER",
          "event_timeslot_10min": "DATETIME",
          "formatted_timestamp_CET": "DATETIME",
          "formatted_timestamp_IST": "DATETIME",
          "search_field": "VARCHAR(8000)"
        }
  
  TIBCO_HAWK:
    index:
      endpoint: http://eurdc01eapl025.nws.nexperia.com:9200/tibco_hawk*/_search
      method: POST
      payload: | 
        {
          "query": {
            "match_all": {
                
            }
          },
          "size": 10000
        }
      header: |
       {"Content-Type": "application/json"}
      
      size: 10000
    
    timeout: 30

    api_credentials:
      username: ${ELASTIC_USERNAME}
      password: ${ELASTIC_PASSWORD}

    destination:
      sql_table_name: TIBCO_HAWK
      sql_pk: ["_id"]
      sql_pk_constraint_name: PK_TIBCO_HAWK
      sql_columnar_index_name: ncci_TIBCO_HAWK
      sql_columns: |
        {
          "errorType": "VARCHAR(64)",
          "_id": "VARCHAR(255) COLLATE Latin1_General_CS_AS NOT NULL",
